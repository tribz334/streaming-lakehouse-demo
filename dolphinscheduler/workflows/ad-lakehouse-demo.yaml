project: ustc-streaming-lakehouse-demo

workflows:
  - name: ad_lakehouse_daily_offline
    description: Daily bounded lakehouse load defined by the thesis.
    schedule:
      cron: "0 0 2 * * ?"
      timezone: Asia/Shanghai
    tasks:
      - name: prepare_catalogs
        type: SHELL
      - name: ods_snapshot_check
        type: FLINK_SQL_BATCH
        sql: flink/sql/06_offline_ods_check.sql
        depends_on: [prepare_catalogs]
      - name: verify_cdc_dimensions
        type: FLINK_REST
        depends_on: [prepare_catalogs]
      - name: dws_theme_load
        type: FLINK_SQL_BATCH
        sql: flink/sql/08_offline_dws.sql
        depends_on: [ods_snapshot_check, verify_cdc_dimensions]
      - name: dm_layer_load
        type: FLINK_SQL_BATCH
        sql: flink/sql/09_offline_dm.sql
        depends_on: [dws_theme_load]
      - name: ads_retention
        type: FLINK_SQL_BATCH
        sql: flink/sql/10_ads_retention.sql
        depends_on: [ods_snapshot_check, verify_cdc_dimensions]
      - name: ads_attribution
        type: FLINK_SQL_BATCH
        sql: flink/sql/11_ads_attribution.sql
        depends_on: [dm_layer_load]
      - name: ads_antifraud
        type: FLINK_SQL_BATCH
        sql: flink/sql/12_ads_fraud.sql
        depends_on: [dm_layer_load]
      - name: ads_creative_offline
        type: FLINK_SQL_BATCH
        sql: flink/sql/13_ads_creative_offline.sql
        depends_on: [dws_theme_load]
      - name: publish_offline_receipt
        type: SHELL
        depends_on: [ads_retention, ads_attribution, ads_antifraud, ads_creative_offline]

  - name: ad_lakehouse_realtime_operations
    description: Manual stop-and-restart workflow for persistent streaming jobs.
    schedule: manual
    tasks:
      - name: stop_existing_stream_jobs
        type: FLINK_REST
      - name: prepare_realtime_resources
        type: SHELL
        depends_on: [stop_existing_stream_jobs]
      - name: start_mysql_cdc
        type: FLINK_CDC_PIPELINE
        yaml: flink-cdc/mysql-to-paimon.yaml
        depends_on: [prepare_realtime_resources]
      - name: start_realtime_java_job
        type: SHELL
        command: scripts/linux/submit-streaming-jobs.sh
        depends_on: [prepare_realtime_resources]
      - name: verify_realtime_jobs
        type: FLINK_REST
        depends_on: [start_realtime_java_job, start_mysql_cdc]

  - name: ad_realtime_daily_rollover
    description: Archive completed dates, delete expired 10-second windows, and validate the new business day.
    schedule:
      cron: "0 5 0 * * ?"
      timezone: Asia/Shanghai
    tasks:
      - name: verify_realtime_metric_job
        type: FLINK_REST
      - name: archive_yesterday_metrics
        type: STARROCKS_SQL
        table: ad_ads.realtime_ad_metrics_daily
        depends_on: [verify_realtime_metric_job]
      - name: delete_expired_realtime_windows
        type: STARROCKS_SQL
        table: ad_ads.realtime_ad_attribution_metrics_10s
        depends_on: [archive_yesterday_metrics]
      - name: verify_business_day_rollover
        type: STARROCKS_SQL
        view: ad_ads.v_realtime_ad_metrics_today
        depends_on: [delete_expired_realtime_windows]
      - name: publish_daily_rollover_receipt
        type: SHELL
        depends_on: [verify_business_day_rollover]
