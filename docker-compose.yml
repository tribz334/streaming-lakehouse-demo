name: ${COMPOSE_PROJECT_NAME:-ustc_lakehouse}

services:
  mysql:
    image: mysql:8.4
    hostname: mysql
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports: ["3306:3306"]
    volumes:
      - ./runtime-data/mysql:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  zookeeper:
    image: zookeeper:3.9.2
    hostname: zookeeper
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    volumes:
      - ./runtime-data/zookeeper/data:/data
      - ./runtime-data/zookeeper/log:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 5s
      timeout: 3s
      retries: 30

  fluss-coordinator:
    image: apache/fluss:${FLUSS_VERSION}
    hostname: fluss-coordinator
    command: coordinatorServer
    environment:
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: FLUSS://fluss-coordinator:9123
        remote.data.dir: file:///warehouse/fluss/remote
        datalake.format: paimon
        datalake.paimon.metastore: filesystem
        datalake.paimon.warehouse: file:///warehouse/paimon
    ports: ["19123:9123"]
    volumes: ["./runtime-data/warehouse:/warehouse"]
    depends_on:
      zookeeper:
        condition: service_healthy

  fluss-tablet:
    image: apache/fluss:${FLUSS_VERSION}
    hostname: fluss-tablet
    command: tabletServer
    environment:
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: FLUSS://fluss-tablet:9123
        data.dir: /warehouse/fluss/local
        remote.data.dir: file:///warehouse/fluss/remote
        datalake.format: paimon
        datalake.paimon.metastore: filesystem
        datalake.paimon.warehouse: file:///warehouse/paimon
    volumes: ["./runtime-data/warehouse:/warehouse"]
    depends_on: [fluss-coordinator]

  flink-jobmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
      args:
        FLINK_BASE_IMAGE: ${FLINK_BASE_IMAGE}
    image: ${FLINK_IMAGE}
    hostname: flink-jobmanager
    command: jobmanager
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        parallelism.default: 1
        execution.checkpointing.interval: 30s
        state.backend.type: hashmap
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///warehouse/checkpoints
        table.local-time-zone: Asia/Shanghai
        jobmanager.memory.off-heap.size: 512m
    ports: ["18082:8081"]
    volumes:
      - ./runtime-data/warehouse:/warehouse
      - ./flink/sql:/opt/flink/usrlib/sql:ro
    depends_on:
      mysql:
        condition: service_healthy
      fluss-coordinator:
        condition: service_started
      fluss-tablet:
        condition: service_started

  flink-taskmanager:
    image: ${FLINK_IMAGE}
    pull_policy: never
    hostname: flink-taskmanager
    command: taskmanager
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 16
        taskmanager.memory.process.size: 4096m
        taskmanager.memory.framework.off-heap.size: 512m
        parallelism.default: 1
        execution.checkpointing.interval: 30s
        state.backend.type: hashmap
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///warehouse/checkpoints
        table.local-time-zone: Asia/Shanghai
    volumes: ["./runtime-data/warehouse:/warehouse"]
    depends_on: [flink-jobmanager]

  event-generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    image: ustc/event-generator:latest
    environment:
      GENERATOR_NODE_ID: ingest-node-1
      GENERATOR_RANDOM_SEED: 20260713
      GENERATOR_HISTORY_DAYS: 0
      GENERATOR_HISTORY_EVENTS_PER_DAY: 180
      EVENT_INTERVAL_SECONDS: 0.25
      GENERATOR_LIVE_ORDER_EVERY: 5
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      FLUSS_BOOTSTRAP_SERVERS: fluss-coordinator:9123
      FLUSS_DATABASE: ad_dw
      FLUSS_ODS_TABLE: ods_log_di
      FRAUD_INJECTION_ENABLED: "true"
      FRAUD_BURST_EVERY: 180
      FRAUD_BURST_SIZE: 36
      FRAUD_USER_POOL: 3
    depends_on:
      mysql:
        condition: service_healthy
      fluss-coordinator:
        condition: service_started
      fluss-tablet:
        condition: service_started

  mysql-change-generator:
    profiles: ["mysql-cdc-generator"]
    build:
      context: .
      dockerfile: generator/Dockerfile
    image: ustc/event-generator:latest
    command: ["python", "produce_mysql_changes.py", "--rate", "30"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_GENERATOR_RANDOM_SEED: 20260824
    depends_on:
      mysql:
        condition: service_healthy

  starrocks:
    image: starrocks/fe-ubuntu:4.0-latest
    hostname: starrocks
    command: ["/opt/starrocks/fe_entrypoint.sh", "starrocks"]
    environment: {HOST_TYPE: FQDN, LOG_CONSOLE: "1", CONFIGMAP_MOUNT_PATH: /demo-conf}
    ports: ["18030:8030", "19030:9030", "9010:9010"]
    volumes:
      - ./runtime-data/starrocks/fe-meta:/opt/starrocks/fe/meta
      - ./runtime-data/warehouse:/warehouse
      - ./starrocks/conf/fe.conf:/demo-conf/fe.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP --host=127.0.0.1 --port=9030 --user=root -e 'SHOW FRONTENDS' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  starrocks-be:
    image: starrocks/be-ubuntu:4.0-latest
    restart: unless-stopped
    hostname: starrocks-be
    command: ["/opt/starrocks/be_entrypoint.sh", "starrocks"]
    environment: {HOST_TYPE: FQDN, LOG_CONSOLE: "1", CONFIGMAP_MOUNT_PATH: /demo-conf}
    volumes:
      - ./runtime-data/starrocks/be-storage:/opt/starrocks/be/storage
      - ./runtime-data/warehouse:/warehouse
      - ./starrocks/conf/be.conf:/demo-conf/be.conf:ro
    depends_on:
      starrocks:
        condition: service_healthy

  superset:
    image: ${SUPERSET_IMAGE}
    profiles: ["bi"]
    environment:
      SUPERSET_SECRET_KEY: ustc-streaming-lakehouse-demo-secret
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports: ["18088:8088"]
    volumes:
      - ./runtime-data/superset:/app/superset_home
      - ./superset:/app/pythonpath:ro
    depends_on:
      starrocks:
        condition: service_healthy
    command: ["/bin/bash", "-lc", "superset db upgrade && superset fab create-admin --username admin --firstname USTC --lastname Demo --email admin@example.com --password admin || true; superset init && superset set-database-uri -d StarRocks -u mysql://root@starrocks:9030/ad_ads && python /app/pythonpath/bootstrap_datasets.py && python /app/pythonpath/bootstrap_dashboard.py && superset run -h 0.0.0.0 -p 8088"]
